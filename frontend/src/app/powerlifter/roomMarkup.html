<main id="wallMain" style="display:contents">
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Powerlifting by Ashik</h1>
<canvas class="sky" id="sky" aria-hidden="true"></canvas>
<div class="wall" id="wall" role="region" aria-label="Lifts and photos floating in the dark. Drag, scroll or use the arrow keys to move around, then press Enter to open the photo in the middle of the screen." tabindex="0">
  <div class="space" id="space"></div>
</div>

<div class="bar">
  <a class="chip" href="/#works" id="back" style="min-height:44px">← Back to the doors</a>
  <div class="bar__right">
    <span class="chip chip--title">Powerlifting <small>IPF RAW</small></span>
    <span class="chip chip--prs">TOTAL: <b>315 KG</b> · SQ: <b>110 KG</b> · BP: <b>70 KG</b> · DL: <b>135 KG</b></span>
  </div>
</div>
<div class="chip hint" id="hint" aria-hidden="true">Drag in any direction</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Lift & Photo" hidden>
  <div class="lb__wrap">
    <img id="lbImg" alt="" style="display:none">
    <video id="lbVid" controls playsinline loop style="display:none"></video>
    <div class="lb__meta" id="lbMeta">
      <h2 id="lbTitle">235 KG Conventional Deadlift</h2>
      <p id="lbSub">All-Time Gym PR · Clean Lockout</p>
      <div class="lb__specs" id="lbSpecs"></div>
    </div>
  </div>
  <button class="chip lb__close" id="lbClose">Close</button>
  <button class="chip lb__nav lb__nav--p" id="lbPrev" aria-label="Previous lift">←</button>
  <button class="chip lb__nav lb__nav--n" id="lbNext" aria-label="Next lift">→</button>
  <span class="chip lb__count" id="lbCount">1 / 18</span>
</div>
</main>
